<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Услуга — Kazakh Studio Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg"></div>

  <header class="header">
    <h1 class="title">Kazakh Studio Booking</h1>
    <p class="subtitle">Детальная информация об услуге</p>

    <nav style="margin-top: 16px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
      <a class="btn-ghost" href="about.html" style="width:auto; margin-top:0; text-decoration:none;">О проекте</a>
      <a class="btn-ghost" href="index.html" style="width:auto; margin-top:0; text-decoration:none;">Каталог</a>
    </nav>
    <nav id="auth-slot" class="auth-nav"></nav>
  </header>

  <div id="alert-container" class="alerts"></div>

  <main class="layout" style="grid-template-columns: 1fr;">
    <section class="panel">
      <div id="service-detail">
        <p class="center-note">Загрузка...</p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-top">
        <h2 class="panel-title">Отзывы</h2>
        <div class="panel-chip" id="reviews-count">0</div>
      </div>

      <div id="review-form-wrap"></div>
      <div id="reviews-list" class="cards"></div>
    </section>

    <section class="panel">
      <div class="panel-top">
        <h2 class="panel-title">Похожие услуги</h2>
        <div class="panel-chip">Related</div>
      </div>
      <div id="related-grid" class="cards" style="flex-direction: row; flex-wrap: wrap;"></div>
      <div class="load-more-wrap">
        <button id="related-more" class="btn-ghost" style="display:none;">Показать ещё похожие</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/service.js"></script>
</body>
</html>
