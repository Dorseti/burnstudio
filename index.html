<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burn Studio Booking — Каталог услуг</title>
  <meta name="description" content="Каталог стилей и услуг тату-студии">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="bg"></div>

  <header class="header">
    <h1 class="title">Burn Studio Booking</h1>
    <p class="subtitle">Каталог стилей и услуг</p>

    <nav style="margin-top: 16px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
      <a class="btn-ghost" href="./about.html" style="width:auto; margin-top:0; text-decoration:none;">О проекте</a>
      <a class="btn-ghost" href="./index.html" style="width:auto; margin-top:0; text-decoration:none;">Каталог</a>
    </nav>
    <nav id="auth-slot" class="auth-nav"></nav>
  </header>

  <div id="alert-container" class="alerts"></div>

  <section class="editorial-hero" aria-label= "Burn Studio — искусство в огне">
    <div class="hero-art">
      <img src="../image/aimfire-hero.png" width="736" height="1041" alt="Авторский арт-постер студии в огненной палитре">
      <span class="hero-index">01 / BURN</span>
    </div>
    <div class="hero-copy">
      <p class="hero-kicker">BURN STUDIO / TATTOO ARCHIVE</p>
      <h2>NOW<br><em>OR</em> NEVER</h2>
      <p>Система онлайн-записи в тату-студию BURN</p>
      <a class="hero-link" href="#services-grid">Смотреть каталог <span>↓</span></a>
    </div>
    <div class="hero-stamp">BRN<br>2026</div>
  </section>

  <main class="layout" style="grid-template-columns: 1fr;">
    <section class="panel panel-catalog">
      <div class="panel-top">
        <h3 class="panel-title">Услуги</h3>
        <div class="panel-chip" id="count-chip">0</div>
      </div>

      <div class="filters">
        <input type="text" id="search-input" placeholder="Поиск по названию или описанию..." style="flex: 2; min-width: 180px; padding: 8px 10px; border: 2px solid rgba(0,0,0,.69); border-radius: 10px; background: rgba(0,0,0,.5); color: var(--text); font-size: 12px;">

        <select id="filter-category">
          <option value="all">Все стили</option>
          <option>Минимализм</option>
          <option>Блэкворк</option>
          <option>Аниме</option>
          <option>Реализм</option>
          <option>Орнаментал</option>
          <option>Другое</option>
        </select>

        <select id="sort-by">
          <option value="newest">Сначала новые</option>
          <option value="oldest">Сначала старые</option>
          <option value="price-asc">Цена ↑</option>
          <option value="price-desc">Цена ↓</option>
          <option value="rating">По рейтингу</option>
        </select>
      </div>

      <div id="services-grid" class="cards" style="flex-direction: row; flex-wrap: wrap;"></div>

      <div class="load-more-wrap">
        <button id="load-more" class="btn-ghost" style="display:none;">Показать ещё</button>
      </div>
      <p class="center-note" id="realtime-note" style="display:none;">Список обновляется автоматически — новые услуги появляются без перезагрузки страницы</p>
    </section>
  </main>

  <script type="module" src="../js/main.js"></script>
</body>
</html>
