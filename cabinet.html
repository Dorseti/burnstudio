<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — Burn Studio Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg"></div>

  <header class="header">
    <h1 class="title">Burn Studio Booking</h1>
    <p class="subtitle">Личный кабинет</p>
    <nav style="margin-top: 16px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
      <a class="btn-ghost" href="./index.html" style="width:auto; margin-top:0; text-decoration:none;">Каталог</a>
      <a class="btn-ghost" href="./my-bookings.html" style="width:auto; margin-top:0; text-decoration:none;">Мои активные записи</a>
    </nav>
    <nav id="auth-slot" class="auth-nav"></nav>
  </header>

  <div id="alert-container" class="alerts"></div>

  <main class="layout" style="grid-template-columns: 1fr;">
    <section class="panel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="profile-tab">Профиль</button>
        <button class="tab-btn" data-tab="history-tab">История записей</button>
        <button class="tab-btn" data-tab="reviews-tab">Мои отзывы</button>
      </div>

      <div id="profile-tab" class="tab-panel active">
        <form id="profile-form" class="form">
          <div class="grid">
            <div class="field">
              <label for="profile-name">Имя</label>
              <input type="text" id="profile-name">
            </div>
            <div class="field">
              <label for="profile-phone">Телефон</label>
              <input type="tel" id="profile-phone">
            </div>
            <div class="field field-wide">
              <label>Email</label>
              <input type="text" id="profile-email" disabled>
            </div>
          </div>
          <div class="form-bottom">
            <div></div>
            <button type="submit" class="btn-primary">Сохранить профиль</button>
          </div>
        </form>
      </div>

      <div id="history-tab" class="tab-panel">
        <div id="history-list" class="cards"></div>
      </div>

      <div id="reviews-tab" class="tab-panel">
        <div id="my-reviews-list" class="cards"></div>
      </div>
    </section>
  </main>

  <script type="module" src="js/cabinet.js"></script>
</body>
</html>
