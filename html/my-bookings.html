<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои записи — Kazakh Studio Booking</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="bg"></div>

  <header class="header">
    <h1 class="title">Kazakh Studio Booking</h1>
    <p class="subtitle">Мои активные записи</p>
    <nav style="margin-top: 16px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
      <a class="btn-ghost" href="./index.html" style="width:auto; margin-top:0; text-decoration:none;">Каталог</a>
      <a class="btn-ghost" href="./cabinet.html" style="width:auto; margin-top:0; text-decoration:none;">Кабинет</a>
    </nav>
    <nav id="auth-slot" class="auth-nav"></nav>
  </header>

  <div id="alert-container" class="alerts"></div>

  <main class="layout" style="grid-template-columns: 1fr;">
    <section class="panel">
      <div class="panel-top">
        <h2 class="panel-title">Активные записи</h2>
        <div class="panel-chip" id="count-chip">0</div>
      </div>
      <p class="center-note">Статусы обновляются автоматически, как только студия подтвердит запись</p>
      <div id="my-bookings-list" class="cards" style="margin-top: 12px;"></div>
    </section>
  </main>

  <script type="module" src="../js/my-bookings.js"></script>
</body>
</html>
