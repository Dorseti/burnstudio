<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Kazakh Studio Booking</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="bg"></div>

  <header class="header">
    <h1 class="title">Kazakh Studio Booking</h1>
    <p class="subtitle">Вход в аккаунт</p>
    <nav style="margin-top: 16px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
      <a class="btn-ghost" href="./index.html" style="width:auto; margin-top:0; text-decoration:none;">Каталог</a>
    </nav>
  </header>

  <div id="alert-container" class="alerts"></div>

  <main class="layout" style="grid-template-columns: 1fr;">
    <section class="panel form-narrow">
      <div class="tabs">
        <button class="tab-btn active" data-tab="login-tab">Вход</button>
        <button class="tab-btn" data-tab="register-tab">Регистрация</button>
      </div>

      <div id="login-tab" class="tab-panel active">
        <form id="login-form" class="form">
          <div class="grid" style="grid-template-columns: 1fr;">
            <div class="field">
              <label for="login-email">Email</label>
              <input type="email" id="login-email" autocomplete="email">
            </div>
            <div class="field">
              <label for="login-password">Пароль</label>
              <input type="password" id="login-password" autocomplete="current-password">
            </div>
          </div>
          <div class="form-bottom">
            <button type="button" id="reset-password-link" class="btn-ghost" style="width:auto;margin-top:0;">Забыли пароль?</button>
            <button type="submit" class="btn-primary">Войти</button>
          </div>
        </form>
      </div>

      <div id="register-tab" class="tab-panel">
        <form id="register-form" class="form">
          <div class="grid" style="grid-template-columns: 1fr;">
            <div class="field">
              <label for="reg-name">Имя</label>
              <input type="text" id="reg-name" autocomplete="name">
            </div>
            <div class="field">
              <label for="reg-phone">Телефон</label>
              <input type="tel" id="reg-phone" autocomplete="tel">
            </div>
            <div class="field">
              <label for="reg-email">Email</label>
              <input type="email" id="reg-email" autocomplete="email">
            </div>
            <div class="field">
              <label for="reg-password">Пароль (минимум 6 символов)</label>
              <input type="password" id="reg-password" autocomplete="new-password">
            </div>
          </div>
          <div class="form-bottom">
            <div></div>
            <button type="submit" class="btn-primary">Зарегистрироваться</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
